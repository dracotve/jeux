<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Pixel Art Game - The Riddle</title>
    <style>
        /* === STYLES DE BASE DU JEU === */
        body {
            margin: 0;
            background: black;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            color: white;
            font-family: 'Courier New', Courier, monospace;
        }

        canvas {
            border: 2px solid white;
            image-rendering: pixelated;
            display: none;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
            z-index: 30;
        }

        #main-menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://i.imgur.com/nqK5nxv.png') no-repeat center center / cover;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            z-index: 20;
            padding: 50px;
            box-sizing: border-box;
        }

        .btn {
            background: rgba(0, 0, 0, 0.6);
            color: white;
            border: 2px solid white;
            padding: 15px 30px;
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.1em;
            transition: 0.3s;
            margin: 10px;
        }

        .btn:hover { background: white; color: black; }

        /* === STYLES DE LA NOUVELLE BOUTIQUE (MODAL INCLUS) === */
        #shop-overlay {
            background: url('https://i.imgur.com/cj2JGzm.png') center/cover no-repeat fixed;
            z-index: 100;
            overflow-y: auto;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 50px;
        }

        .shop-container { max-width: 800px; width: 100%; }
        
        .shop-title {
            font-family: 'Arial Black', sans-serif;
            font-size: 80px;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 8px;
            text-shadow: 0 0 20px #ff00ff, 0 0 40px #00ffff, 4px 4px 0px #8b00ff;
            background: linear-gradient(180deg, #fff 0%, #e0b3ff 50%, #fff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: glow 2s ease-in-out infinite alternate;
            text-align: center;
            margin-bottom: 30px;
        }

        @keyframes glow {
            from { filter: drop-shadow(0 0 10px #ff00ff) drop-shadow(0 0 20px #00ffff); }
            to { filter: drop-shadow(0 0 20px #ff00ff) drop-shadow(0 0 40px #00ffff); }
        }

        .shop-content-box {
            background: linear-gradient(135deg, rgba(100, 100, 120, 0.9), rgba(80, 80, 100, 0.9));
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 0 30px rgba(255, 0, 255, 0.5);
            border: 3px solid rgba(255, 255, 255, 0.3);
        }

        .pack-container {
            position: relative;
            border-radius: 15px;
            overflow: hidden;
            background: #000;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .pack-container:hover { transform: scale(1.02); }

        .price-tag {
            position: absolute;
            bottom: 15px;
            right: 15px;
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.95), rgba(50, 0, 100, 0.9));
            padding: 12px 20px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 2px solid #ffdf00;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
        }

        .modal.active { display: flex; }

        .modal-content {
            background: linear-gradient(135deg, rgba(30, 30, 50, 0.98), rgba(50, 30, 70, 0.98));
            padding: 40px;
            border-radius: 20px;
            max-width: 900px;
            width: 90%;
            border: 3px solid rgba(255, 255, 255, 0.3);
            position: relative;
            animation: slideIn 0.4s ease;
        }

        @keyframes slideIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .cars-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-top: 20px;
        }

        .car-item {
            background: rgba(0, 0, 0, 0.4);
            padding: 10px;
            border-radius: 10px;
            border: 1px solid rgba(0, 255, 255, 0.3);
            text-align: center;
        }

        .car-image { width: 100%; border-radius: 5px; }

        .buy-button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            background: linear-gradient(135deg, #ff00ff, #00ffff);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1.5em;
            cursor: pointer;
            margin-top: 20px;
        }

        #back-from-shop {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 110;
        }
    </style>
</head>
<body>

<div id="main-menu">
    <h1 style="font-size: 3.5em; text-shadow: 3px 3px 10px black;">THE CAR CAN CHANGE YOUR LIFE</h1>
    <div style="display: flex; gap: 20px; align-self: flex-end;">
        <button id="shop-btn" class="btn" style="border-color: #ff00ff; box-shadow: 0 0 10px #ff00ff;">BOUTIQUE</button>
        <button id="credits-btn" class="btn">CREDITS</button>
        <button id="play-button" class="btn">PLAY</button>
    </div>
</div>

<div id="shop-overlay" class="overlay">
    <button id="back-from-shop" class="btn">⬅ RETOUR</button>
    <div class="shop-container">
        <h1 class="shop-title">SHOP</h1>
        <div class="shop-content-box">
            <div class="pack-container" onclick="openShopModal()">
                <img src="https://i.imgur.com/jjRZH4o.png" alt="Drift Car Skin Pack" style="width:100%; display:block; border-radius:15px;">
                <div class="price-tag">
                    <img src="https://i.imgur.com/2BZI97W.png" alt="Coin" style="width:30px;">
                    <span class="price-amount">1,500</span>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="carModal" class="modal">
    <div class="modal-content">
        <span style="position:absolute; top:10px; right:20px; font-size:40px; cursor:pointer;" onclick="closeShopModal()">&times;</span>
        <h2 style="text-align:center; font-size:32px; color:#fff; text-transform:uppercase;">Drift Car Skin Pack</h2>
        <p style="text-align:center; color:#ffdf00;">4 Custom Skins Exclusifs</p>
        
        <div class="cars-grid">
            <div class="car-item"><img src="https://i.imgur.com/nrOZD1y.png" class="car-image"><div style="margin-top:5px;">Fire Dragon</div></div>
            <div class="car-item"><img src="https://i.imgur.com/LRW7rJa.png" class="car-image"><div style="margin-top:5px;">Golden Beast</div></div>
            <div class="car-item"><img src="https://i.imgur.com/t1GBH3V.png" class="car-image"><div style="margin-top:5px;">Blue Lightning</div></div>
            <div class="car-item"><img src="https://i.imgur.com/Gv6Dy2i.png" class="car-image"><div style="margin-top:5px;">Red Warrior</div></div>
        </div>

        <button class="buy-button" onclick="confirmPurchase()">
            <img src="https://i.imgur.com/2BZI97W.png" style="width:30px;"> ACHETER - 1,500
        </button>
    </div>
</div>

<div id="loading-overlay" class="overlay">
    <div class="loader-text">CHARGEMENT...</div>
</div>

<canvas id="game" width="800" height="450"></canvas>

<script>
// --- LOGIQUE DES MENUS ---
const shopOverlay = document.getElementById("shop-overlay");
const mainMenu = document.getElementById("main-menu");

document.getElementById("shop-btn").onclick = () => {
    shopOverlay.style.display = "flex";
    mainMenu.style.display = "none";
};

document.getElementById("back-from-shop").onclick = () => {
    shopOverlay.style.display = "none";
    mainMenu.style.display = "flex";
};

function openShopModal() {
    document.getElementById('carModal').classList.add('active');
}

function closeShopModal() {
    document.getElementById('carModal').classList.remove('active');
}

function confirmPurchase() {
    alert('Achat confirmé ! Vous avez débloqué le Drift Car Skin Pack.');
    closeShopModal();
}

// --- TON CODE DE JEU ORIGINAL (Canvas, Car, Player, etc.) ---
// (À insérer ici pour que le bouton PLAY fonctionne toujours)
document.getElementById("play-button").onclick = () => {
    mainMenu.style.display = "none";
    // ... suite de ta logique de chargement et de démarrage
};
</script>

</body>
</html>
